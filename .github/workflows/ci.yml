name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so the exact release is pinned.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # --with-deps installs the Linux system libraries WebKit needs.
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Run tests
        run: uv run pytest

      # always(): the report matters most when tests fail.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: reports/
          retention-days: 14
