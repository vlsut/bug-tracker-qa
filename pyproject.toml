[project]
name = "bug-tracker-qa"
version = "0.1.0"
description = "Bug Tracker web app (Flask + SQLite) and a UI / API / DB / mobile test framework for it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.10.0",
    "requests>=2.34.2",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "ANN", # type hints on all functions
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Screenshots and traces of failed UI tests go to test-results/; traces stay local (D-013).
addopts = """--strict-markers --html=reports/report.html --self-contained-html
  --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results"""
markers = [
    "ui: UI tests through the browser (Playwright)",
    "api: JSON API tests (requests)",
    "db: database-level checks (sqlite3)",
    "e2e: end-to-end scenarios across several levels",
    "smoke: fast checks that the app is up and basic flows work",
    "mobile: responsive layout on emulated mobile devices",
    "req(*ids): requirement IDs from docs/requirements.md that the test covers (mandatory)",
    "tc(*ids): test case IDs from docs/test-cases.md that the test automates",
]
